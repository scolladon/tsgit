APPLY_FIXES: none
VALIDATE_ALL_CODEBASE: false
SHOW_ELAPSED_TIME: true
FILEIO_REPORTER: false

DISABLE_LINTERS:
  - JAVASCRIPT_ES
  - JAVASCRIPT_PRETTIER
  - TYPESCRIPT_ES
  - TYPESCRIPT_PRETTIER
  - JSON_PRETTIER

ENABLE_LINTERS:
  - JSON_JSONLINT
  - YAML_YAMLLINT
  - MARKDOWN_MARKDOWNLINT
  - SPELL_CSPELL
  - REPOSITORY_SECRETLINT
  # MegaLinter v10 removed REPOSITORY_GITLEAKS; BETTERLEAKS is its drop-in
  # replacement and reads `.gitleaks.toml` / `.gitleaksignore` unchanged (this
  # repo has neither, so it runs on defaults).
  - REPOSITORY_BETTERLEAKS
  - REPOSITORY_CHECKOV

FILTER_REGEX_EXCLUDE: (dist/|coverage/|reports/|\.stryker-tmp/|node_modules/)

REPOSITORY_SECRETLINT_FILTER_REGEX_EXCLUDE: test/unit/application/commands/internal/url-validate\.test\.ts
REPOSITORY_BETTERLEAKS_FILTER_REGEX_EXCLUDE: test/unit/application/commands/internal/url-validate\.test\.ts

# The url-validate SSRF suite embeds dummy user:pass@host URLs as test inputs (already
# excluded from secretlint + betterleaks above). checkov's CKV_SECRET_4 "Basic Auth
# Credentials" flags them too; its FILTER_REGEX_EXCLUDE is not honoured in --file mode,
# so disable that one check. Real basic-auth secrets stay covered by secretlint +
# betterleaks.
REPOSITORY_CHECKOV_ARGUMENTS: "--skip-check CKV_SECRET_4"
# The config lists MegaLinter's own linter keys (JSON_JSONLINT, …), which are not words; the
# local spelling check never scans this dotfile either (cspell skips dotfiles by default).
# cspell.json is the dictionary itself: its escaped non-ASCII entries (`münchen`) read as
# unknown fragments, and the local check's globs never include it.
SPELL_CSPELL_FILTER_REGEX_EXCLUDE: (\.mega-linter\.yml|cspell\.json)
