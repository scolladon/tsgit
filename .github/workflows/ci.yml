name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

# Tightest-by-default top-level permissions. Individual jobs that need more
# (benchmark-snapshot pushes to gh-pages, benchmark-compare comments on PRs)
# escalate locally.
permissions:
  contents: read

jobs:
  # ──────────────────────────────────────────────
  # Stage 0: Change detection (ADR-103)
  #   On PR events, emit `code=true` if the diff touches any code-relevant
  #   path (src/, test/, tooling/, .github/, config). On push (main, tags)
  #   always `code=true`. Downstream code-gated jobs gate on this output
  #   so docs-only PRs skip the heavy matrix.
  # ──────────────────────────────────────────────

  changes:
    runs-on: ubuntu-latest
    outputs:
      code: ${{ steps.detect.outputs.code }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - id: detect
        env:
          BASE_SHA: ${{ github.event_name == 'pull_request' && github.event.pull_request.base.sha || '' }}
          HEAD_SHA: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.sha || github.sha }}
        run: bash .github/scripts/has-code-changes.sh "$BASE_SHA" "$HEAD_SHA"

  # ──────────────────────────────────────────────
  # Stage 1: Static Analysis (parallel, no deps)
  #   Most run regardless of diff (lint formats .md too; filesystem/spelling/
  #   deps/security are diff-agnostic). The code-only static checks
  #   (typecheck/dead-code/duplicates/architecture) gate on `changes`.
  # ──────────────────────────────────────────────

  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/setup
      - run: npm run check

  typecheck:
    needs: [changes]
    if: needs.changes.outputs.code == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/setup
      - run: npm run check:types

  dead-code:
    needs: [changes]
    if: needs.changes.outputs.code == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/setup
      - run: npm run check:dead-code

  duplicates:
    needs: [changes]
    if: needs.changes.outputs.code == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/setup
      - run: npm run check:duplicates

  filesystem:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/setup
      - run: npm run check:filesystem

  architecture:
    needs: [changes]
    if: needs.changes.outputs.code == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/setup
      - run: npm run check:architecture

  spelling:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/setup
      - run: npm run check:spelling

  deps:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/setup
      - run: npm run check:deps

  security:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/setup
      - run: npm run check:security

  # ──────────────────────────────────────────────
  # Stage 1b: Doc-maintenance harness (Phase 18.3)
  #   Four parallel jobs detecting documentation drift independently.
  #   See docs/design/18-3-doc-maintenance-harness.md.
  # ──────────────────────────────────────────────

  doc-links:
    needs: [lint, typecheck]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Restore lychee cache
        uses: actions/cache@v6
        with:
          path: .lycheecache
          key: lychee-${{ hashFiles('.lychee.toml') }}-${{ github.run_id }}
          restore-keys: |
            lychee-${{ hashFiles('.lychee.toml') }}-
            lychee-
      - uses: lycheeverse/lychee-action@v2
        with:
          args: >-
            --config .lychee.toml
            --no-progress
            README.md
            CONTRIBUTING.md
            RUNBOOK.md
            SECURITY.md
            'docs/**/*.md'
          fail: true

  doc-coverage:
    needs: [lint, typecheck]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/setup
      - run: npm run check:doc-coverage

  doc-typedoc:
    needs: [lint, typecheck]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/setup
      - run: npm run check:doc-typedoc

  test-pyramid-audit:
    needs: [lint, typecheck]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/setup
      - run: npm run check:test-pyramid
      - if: always()
        uses: actions/upload-artifact@v7
        with:
          name: test-pyramid-audit
          path: |
            reports/test-pyramid.json
            reports/test-pyramid.md
          if-no-files-found: ignore
          retention-days: 14

  docs-pr-gate:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    continue-on-error: true
    permissions:
      contents: read
      pull-requests: write
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - name: Compute changed-file set and check for docs drift
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          COMMENT_TAG: "<!-- docs-pr-gate -->"
        run: bash .github/scripts/docs-pr-gate.sh

  # ──────────────────────────────────────────────
  # Stage 2: Build + Verify (needs lint + types)
  # ──────────────────────────────────────────────

  build:
    needs: [changes, lint, typecheck]
    if: needs.changes.outputs.code == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - id: setup
        uses: ./.github/actions/setup
      - name: Restore incremental type-check state
        uses: actions/cache@v6
        with:
          path: .typecheck.tsbuildinfo
          key: tsbuildinfo-${{ runner.os }}-${{ steps.setup.outputs.node-version }}-${{ hashFiles('tsconfig*.json', 'package-lock.json') }}-${{ hashFiles('src/**/*.ts', 'test/**/*.ts', 'tooling/**/*.ts') }}
          restore-keys: |
            tsbuildinfo-${{ runner.os }}-${{ steps.setup.outputs.node-version }}-${{ hashFiles('tsconfig*.json', 'package-lock.json') }}-
      - run: npm run build
      - run: npm run check:size
      - run: npm run check:exports
      - uses: actions/upload-artifact@v7
        with:
          name: dist
          path: dist/
          retention-days: 7

  # ──────────────────────────────────────────────
  # Stage 3: Unit Tests (matrix)
  # ──────────────────────────────────────────────

  unit-tests:
    needs: [changes, lint, typecheck]
    if: needs.changes.outputs.code == 'true'
    strategy:
      fail-fast: false
      matrix:
        # Release-line aliases, not pinned majors: lts/-1 and lts/* track the
        # two current LTS lines and roll forward on their own; `latest` is the
        # Current line, kept as early warning.
        # The real floor is package.json `engines.node` (>=22.22.1, forced by
        # `engine-strict=true` in .npmrc): a line below it fails `npm ci`
        # rather than testing on an unsupported runtime. That floor is what
        # dropped Node 20 — cspell@10 and lint-staged@17 need >=22.18 and
        # >=22.22.1.
        os: [ubuntu-latest, macos-latest, windows-latest]
        node: ['lts/-1', 'lts/*', 'latest']
        include:
          - os: ubuntu-latest
            node: 'lts/-1'
            coverage: true
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7
      - id: setup
        uses: ./.github/actions/setup
        with:
          node-version: ${{ matrix.node }}
      - name: Restore incremental type-check state
        uses: actions/cache@v6
        with:
          path: .typecheck.tsbuildinfo
          key: tsbuildinfo-${{ runner.os }}-${{ steps.setup.outputs.node-version }}-${{ hashFiles('tsconfig*.json', 'package-lock.json') }}-${{ hashFiles('src/**/*.ts', 'test/**/*.ts', 'tooling/**/*.ts') }}
          restore-keys: |
            tsbuildinfo-${{ runner.os }}-${{ steps.setup.outputs.node-version }}-${{ hashFiles('tsconfig*.json', 'package-lock.json') }}-
      # Coverage threshold (100%) is enforced on the Linux gate cell only.
      # Other matrix cells run plain `test:unit` (cross-platform — no
      # platform skipIfs after Phase 14.4's PathPolicy + FsOperations DI
      # refactor).
      - if: matrix.os == 'ubuntu-latest'
        run: npm run test:coverage
      - if: matrix.os != 'ubuntu-latest'
        run: npm run test:unit
      # Upload regardless of pass/fail so a threshold breach can be diagnosed
      # from the artifact instead of just the failed step. Gated on the
      # `coverage` matrix flag (set via `include:`, not a version literal) so
      # the artifact name and upload condition stay stable across every LTS
      # transition instead of rearming this trap at the next one.
      - uses: actions/upload-artifact@v7
        if: always() && matrix.coverage == true
        with:
          name: coverage-report-${{ matrix.os }}
          path: coverage/
          retention-days: 14
          if-no-files-found: warn

  # ──────────────────────────────────────────────
  # Stage 4: Mutation Testing (PRs only, diff-scoped per Phase 19.1)
  #   Scopes Stryker to files changed in the PR vs base.sha, then enforces
  #   per-bucket mutation-score budgets (mutation-budgets.json).
  #   See docs/design/phase-19-1-mutation-pyramid.md, ADRs 100/101/102.
  # ──────────────────────────────────────────────

  mutation:
    if: >-
      github.event_name == 'pull_request' &&
      contains(github.event.pull_request.labels.*.name, 'mutation')
    needs: [unit-tests]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - id: setup
        uses: ./.github/actions/setup
      - name: Restore incremental type-check state
        uses: actions/cache@v6
        with:
          path: .typecheck.tsbuildinfo
          key: tsbuildinfo-${{ runner.os }}-${{ steps.setup.outputs.node-version }}-${{ hashFiles('tsconfig*.json', 'package-lock.json') }}-${{ hashFiles('src/**/*.ts', 'test/**/*.ts', 'tooling/**/*.ts') }}
          restore-keys: |
            tsbuildinfo-${{ runner.os }}-${{ steps.setup.outputs.node-version }}-${{ hashFiles('tsconfig*.json', 'package-lock.json') }}-
      - id: scope
        name: Compute mutated file set
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          set -euo pipefail
          bash .github/scripts/compute-mutation-scope.sh "$BASE_SHA" "$HEAD_SHA" > /tmp/mutate.txt
          # Fail loudly if GITHUB_OUTPUT is missing or unwritable, rather than emit an
          # empty `skip` value (which would evaluate `'' != 'true'` and bypass the gate).
          : "${GITHUB_OUTPUT:?GITHUB_OUTPUT not set; runner misconfigured}"
          if [ -s /tmp/mutate.txt ]; then
            printf 'skip=false\n' >> "$GITHUB_OUTPUT"
            echo "Mutating $(wc -l < /tmp/mutate.txt | tr -d ' ') file(s):"
            cat /tmp/mutate.txt
          else
            echo "::notice::No src/ files changed - skipping mutation"
            printf 'skip=true\n' >> "$GITHUB_OUTPUT"
          fi
      - if: steps.scope.outputs.skip != 'true'
        run: npm run test:mutation:pr
        env:
          TSGIT_MUTATE_PATHS_FILE: /tmp/mutate.txt
      - if: steps.scope.outputs.skip != 'true'
        run: npm run check:mutation-budgets
      - uses: actions/upload-artifact@v7
        if: always() && steps.scope.outputs.skip != 'true'
        with:
          name: mutation-report
          path: reports/mutation/
          retention-days: 14

  # ──────────────────────────────────────────────
  # Stage 5: Integration Tests
  # ──────────────────────────────────────────────

  integration:
    needs: [changes, unit-tests]
    if: needs.changes.outputs.code == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - id: setup
        uses: ./.github/actions/setup
      - name: Restore incremental type-check state
        uses: actions/cache@v6
        with:
          path: .typecheck.tsbuildinfo
          key: tsbuildinfo-${{ runner.os }}-${{ steps.setup.outputs.node-version }}-${{ hashFiles('tsconfig*.json', 'package-lock.json') }}-${{ hashFiles('src/**/*.ts', 'test/**/*.ts', 'tooling/**/*.ts') }}
          restore-keys: |
            tsbuildinfo-${{ runner.os }}-${{ steps.setup.outputs.node-version }}-${{ hashFiles('tsconfig*.json', 'package-lock.json') }}-
      - run: npm run test:integration

  # ──────────────────────────────────────────────
  # Stage 5b: POSIX-only integration tests
  # Real-fs POSIX semantics (chmod mode bits, ELOOP/EISDIR errnos,
  # symlink permissions). The adapter's response to these errnos is
  # exercised cross-platform in test/unit/ via FsOperations DI; this
  # job covers the real OS→adapter wiring. Phase 14.4.
  # ──────────────────────────────────────────────

  posix-integration:
    needs: [changes, unit-tests]
    if: needs.changes.outputs.code == 'true'
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7
      - id: setup
        uses: ./.github/actions/setup
      - name: Restore incremental type-check state
        uses: actions/cache@v6
        with:
          path: .typecheck.tsbuildinfo
          key: tsbuildinfo-${{ runner.os }}-${{ steps.setup.outputs.node-version }}-${{ hashFiles('tsconfig*.json', 'package-lock.json') }}-${{ hashFiles('src/**/*.ts', 'test/**/*.ts', 'tooling/**/*.ts') }}
          restore-keys: |
            tsbuildinfo-${{ runner.os }}-${{ steps.setup.outputs.node-version }}-${{ hashFiles('tsconfig*.json', 'package-lock.json') }}-
      - run: npm run test:posix-integration

  # ──────────────────────────────────────────────
  # Stage 5c: Windows-only integration tests
  # Real-fs Windows semantics (8.3 short-name reconciliation, real
  # mkdtemp paths, openRepository drive-letter acceptance, real Windows
  # symlinks). Phase 14.4.
  # ──────────────────────────────────────────────

  win-integration:
    needs: [changes, unit-tests]
    if: needs.changes.outputs.code == 'true'
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7
      - id: setup
        uses: ./.github/actions/setup
      - name: Restore incremental type-check state
        uses: actions/cache@v6
        with:
          path: .typecheck.tsbuildinfo
          key: tsbuildinfo-${{ runner.os }}-${{ steps.setup.outputs.node-version }}-${{ hashFiles('tsconfig*.json', 'package-lock.json') }}-${{ hashFiles('src/**/*.ts', 'test/**/*.ts', 'tooling/**/*.ts') }}
          restore-keys: |
            tsbuildinfo-${{ runner.os }}-${{ steps.setup.outputs.node-version }}-${{ hashFiles('tsconfig*.json', 'package-lock.json') }}-
      - run: npm run test:win-integration

  # ──────────────────────────────────────────────
  # Stage 5d: Cross-adapter parity tests (Phase 19.5)
  # Runs the same parity scenarios against the Node and Memory adapters
  # and asserts byte-identical results. The Browser side runs through the
  # `e2e` job below. Any divergence is a parity bug — most likely in
  # object serialization, hash framing, or author-identity encoding.
  # ──────────────────────────────────────────────

  parity-tests:
    needs: [changes, unit-tests]
    if: needs.changes.outputs.code == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - id: setup
        uses: ./.github/actions/setup
      - name: Restore incremental type-check state
        uses: actions/cache@v6
        with:
          path: .typecheck.tsbuildinfo
          key: tsbuildinfo-${{ runner.os }}-${{ steps.setup.outputs.node-version }}-${{ hashFiles('tsconfig*.json', 'package-lock.json') }}-${{ hashFiles('src/**/*.ts', 'test/**/*.ts', 'tooling/**/*.ts') }}
          restore-keys: |
            tsbuildinfo-${{ runner.os }}-${{ steps.setup.outputs.node-version }}-${{ hashFiles('tsconfig*.json', 'package-lock.json') }}-
      - run: npm run test:parity
      - uses: actions/upload-artifact@v7
        if: failure()
        with:
          name: parity-report-node-memory
          path: reports/parity/
          retention-days: 14

  # ──────────────────────────────────────────────
  # Stage 5e: Runtime-parity matrix (Phase 19.8)
  # Runs the shared parity SCENARIOS registry on Deno, Bun, and
  # Cloudflare Workers against the dist/ artifact produced by `build`.
  # Failures are blocking — the README `Cross-runtime` claim is gated
  # on every cell staying green (ADR-144). The dist is consumed via
  # direct file imports, not `npm:` specifiers (ADR-141). Workers is
  # memory-only since workerd has no filesystem (ADR-143).
  # ──────────────────────────────────────────────

  # The Deno + Bun jobs deliberately skip `npm install`. The drivers only
  # resolve relative paths (`dist/esm/**`, `test/parity/scenarios/**`,
  # `src/domain/objects/index.ts`) — no npm specifiers — so a checkout +
  # the dist artifact is the entire bill of materials. If a future scenario
  # gains a package-specifier import, the jobs would fail loudly; the gate
  # is therefore self-correcting rather than silently fragile.

  parity-deno:
    needs: [changes, build]
    if: needs.changes.outputs.code == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: denoland/setup-deno@v2
        with:
          deno-version: v2.x
      - uses: actions/download-artifact@v8
        with:
          name: dist
          path: dist/
      - run: deno test --no-check --allow-read --allow-write --allow-env --no-prompt --config test/runtime-parity/deno/deno.json test/runtime-parity/deno/

  parity-bun:
    needs: [changes, build]
    if: needs.changes.outputs.code == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: oven-sh/setup-bun@v2
      - uses: actions/download-artifact@v8
        with:
          name: dist
          path: dist/
      - run: bun test test/runtime-parity/bun/

  parity-workers:
    needs: [changes, build]
    if: needs.changes.outputs.code == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/setup
      - uses: actions/download-artifact@v8
        with:
          name: dist
          path: dist/
      - run: npx vitest run --config test/runtime-parity/workers/vitest.config.ts

  # ──────────────────────────────────────────────
  # Stage 6: E2E / Playwright
  # ──────────────────────────────────────────────

  e2e:
    needs: [changes, integration]
    if: needs.changes.outputs.code == 'true'
    strategy:
      fail-fast: false
      matrix:
        browser: [chromium, firefox, webkit]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/setup
      - run: npx playwright install --with-deps ${{ matrix.browser }}
      - run: npm run test:e2e -- --project=${{ matrix.browser }}
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          # `-ubuntu` suffix is a static literal today; forward-compatible
          # with 19.8's planned multi-OS expansion (no rename then).
          name: playwright-report-${{ matrix.browser }}-ubuntu
          path: test-results/
          retention-days: 14

  # ──────────────────────────────────────────────
  # Stage 7: Performance
  #   PRs: benchmark-compare diffs base vs PR on the same runner — informative
  #   only, never blocks (same-runner benchmarking carries real measurement noise).
  #   Pushes to main: benchmark-snapshot converts the vitest output via
  #   tooling/bench-to-snapshot.ts and feeds github-action-benchmark for
  #   trend tracking + regression alerts. Its data lives on a dedicated
  #   `gh-pages` data branch; the served Pages site (gh-pages.yml) uses the
  #   Actions artifact model and is unaffected.
  # ──────────────────────────────────────────────

  benchmark-snapshot:
    if: github.event_name == 'push'
    needs: [unit-tests]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7
      - id: setup
        uses: ./.github/actions/setup
      - name: Restore scaled bench fixture cache
        uses: actions/cache@v6
        with:
          path: ~/.cache/tsgit-bench
          key: tsgit-bench-${{ hashFiles('test/bench/support/fixture-generator.ts') }}
      - run: npm run test:bench
      - run: node --experimental-strip-types tooling/bench-to-snapshot.ts
        env:
          RESOLVED_NODE_VERSION: ${{ steps.setup.outputs.node-version }}
      - name: Publish benchmark snapshot
        uses: benchmark-action/github-action-benchmark@v1
        with:
          name: tsgit benchmarks
          tool: customSmallerIsBetter
          output-file-path: reports/benchmarks/snapshot.json
          github-token: ${{ github.token }}
          auto-push: true
          gh-pages-branch: gh-pages
          benchmark-data-dir-path: dev/bench
          alert-threshold: '150%'
          comment-on-alert: true
          fail-on-alert: false

  benchmark-compare:
    if: >-
      github.event_name == 'pull_request' &&
      needs.changes.outputs.code == 'true' &&
      contains(github.event.pull_request.labels.*.name, 'bench')
    needs: [changes, unit-tests]
    runs-on: ubuntu-latest
    # Informative only — a flagged regression is a prompt to look, never a
    # merge gate. Same-runner benchmarking measures too much noise to block on.
    # Compares per-scenario median-ms, asymmetric (improvements never flag),
    # hot-path-scoped (all CI-run tiers) — only the operations listed in
    # docs/perf/hot-paths.json, across every tier this job runs (small +
    # medium; large stays env-gated off), threshold N ≈ 10%.
    #
    # Four properties keep the RUNNER from deciding the verdict instead of the
    # diff. Without them this job reported a >17% regression on a bench whose
    # code the PR never touched, while calling ten unrelated scenarios faster:
    #   * base and head get their own checkout, so alternating a round costs a
    #     `cd` rather than a re-checkout and re-install;
    #   * both sides run the SAME bench files — the hot-path set, intersected
    #     across the two trees. A PR that adds bench files must not hand its
    #     own side extra CPU contention that the base side never paid;
    #   * rounds ALTERNATE base/head, so monotonic drift (page cache warming,
    #     thermal, a noisy neighbour arriving) is shared instead of accruing
    #     to whichever side always ran second;
    #   * each side is reduced by its FASTEST round per scenario — bench noise
    #     only ever adds time, so the minimum is the least contaminated
    #     estimate. See `bestOfRounds` in tooling/bench-check.ts.
    # No `npm run build`: `test:bench` depends on `check:types` only, and the
    # bench files import from `src/`, so building was ~2 minutes of pure waste
    # per side.
    continue-on-error: true
    permissions:
      pull-requests: write
    env:
      BENCH_ROUNDS: "3"
    steps:
      - name: Checkout base branch
        uses: actions/checkout@v7
        with:
          ref: ${{ github.event.pull_request.base.sha }}
          path: base

      - name: Checkout PR branch
        uses: actions/checkout@v7
        with:
          path: head

      # Deliberately NOT ./.github/actions/setup: that composite installs into
      # the workspace ROOT, and this job is the one place with two trees and no
      # package.json at the root. `cache-dependency-path` has to name both
      # lockfiles for the same reason — setup-node looks for one at the root
      # and finds nothing.
      - uses: actions/setup-node@v7
        with:
          node-version: "lts/*"
          cache: npm
          cache-dependency-path: |
            base/package-lock.json
            head/package-lock.json

      - name: Install base dependencies
        working-directory: base
        env:
          HUSKY: "0"
        run: npm ci

      - name: Install PR dependencies
        working-directory: head
        env:
          HUSKY: "0"
        run: npm ci

      - name: Restore scaled bench fixture cache
        uses: actions/cache@v6
        with:
          path: ~/.cache/tsgit-bench
          key: tsgit-bench-${{ hashFiles('head/test/bench/support/fixture-generator.ts') }}

      - name: Resolve the bench files both trees share
        id: bench-files
        run: |
          # The hot-path registry names operations; each maps to one bench
          # file. Intersecting with what BOTH trees actually contain keeps the
          # two sides comparable when a PR adds or renames a hot path.
          FILES=""
          while read -r op; do
            candidate="test/bench/${op}.bench.ts"
            if [ -f "base/${candidate}" ] && [ -f "head/${candidate}" ]; then
              FILES="${FILES} ${candidate}"
            else
              echo "skipping ${candidate} — not present in both trees"
            fi
          done < <(jq -r '.hotOperations[]' head/docs/perf/hot-paths.json)
          if [ -z "${FILES}" ]; then
            echo "no shared hot-path bench files — nothing to compare" >&2
            exit 1
          fi
          echo "files=${FILES# }" >> "$GITHUB_OUTPUT"

      - name: Bench base and head in alternating rounds
        env:
          BENCH_FILES: ${{ steps.bench-files.outputs.files }}
        run: |
          set -euo pipefail
          run_side() {
            local dir="$1" tag="$2" round="$3"
            ( cd "$dir" \
              && npx vitest bench --run --config vitest.bench.config.ts ${BENCH_FILES} )
            cp "${dir}/reports/benchmarks/raw.json" "/tmp/${tag}-bench-${round}.json"
          }
          for round in $(seq 1 "${BENCH_ROUNDS}"); do
            run_side base base "${round}"
            run_side head head "${round}"
          done

      - name: Compare and comment
        env:
          GH_TOKEN: ${{ github.token }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          REGRESSION_THRESHOLD: "10"
        working-directory: head
        run: |
          set -euo pipefail
          join_rounds() {
            local tag="$1" acc=""
            for round in $(seq 1 "${BENCH_ROUNDS}"); do
              acc="${acc},/tmp/${tag}-bench-${round}.json"
            done
            echo "${acc#,}"
          }
          node --experimental-strip-types tooling/bench-check.ts \
            "$(join_rounds base)" "$(join_rounds head)"

      - name: Post PR comment
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          COMMENT_TAG: "<!-- benchmark-comparison -->"
        run: |
          # Delete every previous benchmark-comparison comment, then post a
          # single fresh one. Using `jq --arg` (rather than gh --jq with
          # interpolated bash double-quotes) avoids the quote-collapse bug
          # that previously short-circuited the lookup and orphaned every
          # earlier comment on the PR.
          BODY_FILE=/tmp/bench-comment-full.md
          if [ ! -s /tmp/bench-comment.md ]; then
            echo "Benchmark comparison failed to generate." > /tmp/bench-comment.md
          fi
          {
            echo "$COMMENT_TAG"
            cat /tmp/bench-comment.md
          } > "$BODY_FILE"

          gh api "repos/${REPO}/issues/${PR_NUMBER}/comments" \
            | jq -r --arg tag "$COMMENT_TAG" '.[] | select(.body | startswith($tag)) | .id' \
            | xargs -r -I{} gh api -X DELETE "repos/${REPO}/issues/comments/{}"

          gh api -X POST "repos/${REPO}/issues/${PR_NUMBER}/comments" \
            --field body=@"$BODY_FILE"

  # ──────────────────────────────────────────────
  # Stage 8: MegaLinter (parallel, no deps)
  # ──────────────────────────────────────────────

  megalinter:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: oxsecurity/megalinter@v10
        env:
          VALIDATE_ALL_CODEBASE: false
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: megalinter-report
          path: megalinter-reports/
          retention-days: 14
